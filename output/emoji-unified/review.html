<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji set review</title>
<style>
:root{--size:96px;--surface:#eeeadd}body{margin:24px;background:#183b43;color:#fff6d4;font:15px system-ui}h1{font-size:26px}header{position:sticky;top:0;background:#183b43;padding:12px 0;z-index:2}button,select{padding:8px;margin:4px;border:0;border-radius:4px;background:#fff6d4;color:#183b43}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:var(--surface);color:#195761;padding:12px;border-radius:8px}.pair{display:flex;justify-content:space-around;gap:12px;align-items:center;min-height:160px}.pair img{width:var(--size);height:var(--size);object-fit:contain;image-rendering:pixelated;max-width:100%}figure{margin:0;text-align:center;min-width:0}figcaption{font-size:12px;margin:8px}h2{font-size:15px;margin:0}.anchors{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.anchors img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated}.anchors figure{background:#eeeadd;padding:10px;color:#195761;border-radius:5px}
</style><h1>28 icons · one sprite set</h1><header><label>Display size <select id="size"><option>32</option><option>64</option><option selected>96</option><option>128</option></select></label><button id="bg">Toggle dark background</button><span>Originals left · revised sprites right</span></header><div class="anchors" id="anchors"></div><section id="grid"></section>
<script>
const names='diamondHand msuic cafeteria lab book good refresh slowcooker gym recess logic economy art geography loveheart hallpass crystalBall mountain theater talkingHead horse sunrise dice newspaper student warning door celebrate'.split(' ');
const refs='magic homemade crown artifact deli sleep ice mediumRare'.split(' ');
for(const n of refs){const f=document.createElement('figure');f.innerHTML=`<img alt="${n} style anchor" src="../../assets/images/emojis/${n}.png"><figcaption>${n} · anchor</figcaption>`;document.querySelector('#anchors').append(f)}
for(const n of names){const c=document.createElement('article');c.className='card';c.innerHTML=`<h2>${n}</h2><div class="pair"><figure><img alt="Original ${n}" src="../../assets/images/emojis/${n}.png"><figcaption>Original</figcaption></figure><figure><img alt="Unified ${n}" src="png-256/${n}.png"><figcaption>64px → 256px</figcaption></figure></div>`;document.querySelector('#grid').append(c)}
document.querySelector('#size').onchange=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');let dark=false;document.querySelector('#bg').onclick=()=>{dark=!dark;document.documentElement.style.setProperty('--surface',dark?'#294a53':'#eeeadd');document.querySelectorAll('.card').forEach(c=>c.style.color=dark?'#fff6d4':'#195761')};
</script></html>
